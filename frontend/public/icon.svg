<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4338ca" stroke-width="6" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="6 6" opacity="0.8" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.9" />

  <!-- Orbiting Planets/Nodes -->
  <circle cx="136" cy="256" r="16" fill="#818cf8" />
  <circle cx="256" cy="136" r="12" fill="#c084fc" />
  <circle cx="340" cy="312" r="10" fill="#a78bfa" />

  <!-- Center Star/Planet -->
  <circle cx="256" cy="256" r="48" fill="url(#orbit-grad)" />
  <circle cx="256" cy="256" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
</svg>
